<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farsi Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&family=Vazirmatn:wght@400;700&display=swap">
<style>
/* Learning-path app: zigzag lesson path per unit, bottom tab bar, console-blue backdrop; strong green/red feedback. Single dark look by choice */
:root{--bg:#04122e;--bg2:#0b2f6b;--fg:#eaf2ff;--dim:#93a9cf;--glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.14);--line:rgba(255,255,255,.18);
--acc:#7aa7ff;--ok:#22c55e;--okbg:rgba(34,197,94,.22);--bad:#ef4444;--badbg:rgba(239,68,68,.22);--gold:#f2c14e;--gem:#5ec8ff;--leg:#b78cff;
--ui:"Titillium Web",system-ui,sans-serif;--fa:"Vazirmatn",Tahoma,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 70% 0%,var(--bg2),var(--bg) 70%) fixed;color:var(--fg);font-family:var(--ui);overflow-x:hidden;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
canvas#w{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .25s}
#flash.ok{background:radial-gradient(circle at 50% 40%,rgba(34,197,94,.45),transparent 70%);opacity:1}
#flash.bad{background:radial-gradient(circle at 50% 40%,rgba(239,68,68,.45),transparent 70%);opacity:1}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;padding-block:12px;font-size:15px;color:var(--dim);background:linear-gradient(var(--bg) 70%,transparent);flex-wrap:wrap}
.top b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}.sp{flex:1}
.stat{display:flex;align-items:center;gap:5px}
.goalbar{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.goalbar i{display:block;height:100%;background:var(--gold);border-radius:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(4,18,46,.96);border-top:1px solid var(--line);display:flex;justify-content:center;
padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{display:flex;gap:4px;width:100%;max-width:560px}
.tabs button{flex:1;font:inherit;font-size:12px;color:var(--dim);background:none;border:0;border-radius:10px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px;line-height:1}.tabs button.on{color:var(--fg);background:var(--glass2)}
.inq .tabs{display:none}.inq .app{padding-bottom:28px}
h1{font-weight:300;font-size:clamp(26px,5vw,38px);margin:10px 0 4px;text-wrap:balance}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);font-weight:600;margin:26px 0 10px}
.sub{color:var(--dim);margin:0}
.btn{font-family:inherit;font-size:15px;color:var(--fg);background:var(--glass);border:1px solid var(--line);padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:background .15s}
.btn:hover{background:var(--glass2)}
.btn.pri{background:var(--fg);color:var(--bg);font-weight:700;border-color:var(--fg)}.btn.pri:hover{background:#fff}
.btn.big{font-size:17px;padding:14px 22px;width:100%;max-width:420px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.a:focus-visible,.tile:focus-visible,.tok:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{font-family:inherit;font-size:14px;color:var(--dim);background:none;border:0;padding:8px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);font-weight:600}
.opts{display:flex;gap:14px 22px;flex-wrap:wrap;align-items:flex-start}
.opts label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.note{color:var(--dim);font-size:13px;margin-top:6px}
.panel{border:1px solid var(--line);background:var(--glass);border-radius:14px;padding:16px}
/* path */
.section{margin:22px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center}
.unit{border-radius:14px;padding:14px 16px;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#061229}
.unit .t{font-weight:700;font-size:19px;line-height:1.2}.unit small{display:block;font-size:13px;opacity:.8}
.unit .sp{flex:1}
.unit .btn{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.2);color:#061229;font-weight:700}
.nodes{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 6px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:70px;height:66px;border-radius:50%;border:0;cursor:pointer;font-size:26px;font-weight:700;display:grid;place-items:center;color:#061229;
box-shadow:0 7px 0 rgba(0,0,0,.35);transition:transform .1s;font-family:inherit}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.node.lock{background:#2b3a5c!important;color:#6d7fa3;box-shadow:0 7px 0 #172340}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{max-width:460px;width:100%;background:var(--bg2);display:grid;gap:12px}
.sheet b{font-size:18px}
.node.cur{outline:4px solid rgba(255,255,255,.25);outline-offset:6px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{outline-color:rgba(255,255,255,.6)}}
.bubble{position:absolute;bottom:calc(100% + 14px);background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;white-space:nowrap;letter-spacing:.06em}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--fg)}
.nlabel{font-size:12px;color:var(--dim);margin-top:12px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .t{font-size:20px;font-weight:700}
/* practice hub */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--glass);border-radius:12px;cursor:pointer;color:var(--fg);min-height:112px;
display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px;text-align:left;transition:transform .15s,background .15s;font-family:inherit;min-width:0}
.tile:hover:not(:disabled){transform:translateY(-3px);background:var(--glass2)}.tile:disabled{opacity:.4;cursor:default}
.tile .ic{font-size:26px;line-height:1}.tile .n{font-size:15px;font-weight:700;line-height:1.2}.tile .c{font-size:12.5px;color:var(--dim);line-height:1.35}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;background:linear-gradient(120deg,rgba(122,167,255,.22),rgba(240,140,210,.12))}
.tile .g{font-family:var(--fa);font-size:28px;line-height:1.2}.tile .best{float:right;color:var(--gold)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.why div{border-left:2px solid var(--acc);padding:4px 0 4px 12px;font-size:14px;color:var(--dim)}.why b{display:block;color:var(--fg)}
/* league + profile */
.lb{display:grid;gap:4px;margin-top:12px}
.lb div{display:grid;grid-template-columns:30px 36px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--glass)}
.lb div.me{background:rgba(122,167,255,.25);border:1px solid var(--acc)}
.lb .r{font-weight:700;color:var(--dim);text-align:center}.lb .up .r{color:var(--ok)}.lb .down .r{color:var(--bad)}
.lb .pic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#061229}
.lb b{font-variant-numeric:tabular-nums}
.zone{font-size:12px;text-align:center;padding:4px;letter-spacing:.08em;text-transform:uppercase}
.zone.up{color:var(--ok)}.zone.down{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpis div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--glass)}
.kpis b{display:block;font-size:24px;font-variant-numeric:tabular-nums}.kpis span{font-size:12px;color:var(--dim)}
.vt{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.vrows{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;margin-top:10px;align-items:center;font-size:15px}.vrows .fa{font-size:19px;direction:rtl;text-align:right}.vrows .pp{color:var(--dim);font-size:13px}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.troph div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:flex;gap:8px;align-items:center;opacity:.35}
.troph div.got{opacity:1}.troph i{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;font-style:normal;color:#1a1200;font-size:13px}
.shop{display:grid;gap:10px}
.shop div{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--glass)}
.shop .ic{font-size:28px}.shop .tx{flex:1;min-width:0}.shop small{display:block;color:var(--dim)}
/* lesson */
.qbar{display:flex;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
.qbar .meta{color:var(--dim);font-size:14px}.qbar .meta b{color:var(--fg)}
.x{width:40px;height:40px;padding:0;font-size:20px}
.hearts{color:var(--bad);font-weight:700;font-size:17px}
.lprog{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden;min-width:80px}.lprog i{display:block;height:100%;background:var(--ok);border-radius:7px;transition:width .3s}
.prog{height:6px;background:var(--line);margin:12px 0 0;border-radius:3px;overflow:hidden;display:flex;gap:2px}
.prog i{flex:1;background:var(--line)}.prog i.ok{background:var(--ok)}.prog i.bad{background:var(--bad)}.prog i.cur{background:var(--fg)}
.timer{height:3px;margin-top:6px;border-radius:2px;overflow:hidden}.timer i{display:block;height:100%;background:var(--gold)}
.card{margin:3vh auto 3vh;text-align:center;border-radius:14px;padding:18px;border:2px solid transparent;transition:border-color .2s,background .2s;max-width:720px;width:100%}
.card.ok{border-color:var(--ok);background:var(--okbg)}.card.bad{border-color:var(--bad);background:var(--badbg)}.card.new{border-color:var(--gold);background:rgba(242,193,78,.1)}
.badge{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.badge.gold{color:var(--gold);border-color:var(--gold)}
.word{font-size:clamp(38px,10vw,78px);line-height:1.25;overflow-wrap:anywhere;margin-top:8px}.word.sm{font-size:clamp(22px,6vw,38px)}
.fa{font-family:var(--fa)}.rtl{direction:rtl}
.tr{color:var(--dim);min-height:26px;font-size:18px;margin-top:6px}
.hintbtn{font:inherit;font-size:13px;color:var(--dim);background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.spk{font-size:22px;background:var(--glass2);border:1px solid var(--line);border-radius:50%;width:48px;height:48px;cursor:pointer;color:var(--fg)}
.spk.huge{width:96px;height:96px;font-size:42px;margin-top:10px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px;width:100%;margin:0 auto}
@media (max-width:560px){.ans{grid-template-columns:1fr}}
.a{font-family:inherit;color:var(--fg);background:var(--glass);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px 16px;font-size:18px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;min-width:0;transition:background .15s,transform .1s,border-color .15s}
.a:hover:not(:disabled){background:var(--glass2);border-color:var(--dim)}.a:active{transform:translateY(2px)}.a:disabled{cursor:default}
.a .num{flex:0 0 26px;height:26px;border-radius:6px;background:var(--glass2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--dim)}
.a .v{min-width:0;overflow-wrap:anywhere}.a .v.fa{font-size:23px}
.a.ok{background:var(--ok);border-color:var(--ok);color:#04220f;font-weight:600}.a.ok .num{background:rgba(0,0,0,.18);color:#04220f}
.a.bad{background:var(--bad);border-color:var(--bad);color:#fff}.a.bad .num{background:rgba(0,0,0,.2);color:#fff}
.a.fade{opacity:.4}.a.sel{border-color:var(--gold);background:rgba(242,193,78,.15)}.a.done{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:620px;margin:0 auto}
.pairs .a{justify-content:center;text-align:center;min-height:60px}
.typerow{display:flex;gap:10px;max-width:620px;margin:0 auto;flex-wrap:wrap}
.typerow input{flex:1;min-width:0;font:inherit;font-size:20px;color:var(--fg);background:var(--glass);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.typerow input.ok{border-color:var(--ok);background:var(--okbg)}.typerow input.bad{border-color:var(--bad);background:var(--badbg)}
.slot{min-height:64px;max-width:720px;margin:0 auto 14px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center}
.slot.ok{border-color:var(--ok)}.slot.bad{border-color:var(--bad)}
.pool{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{font:inherit;font-size:19px;color:var(--fg);background:var(--glass2);border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:8px 12px;cursor:pointer}
.tok.fa{font-size:22px}.tok.used{visibility:hidden}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--gold);margin:0 4px}
.fb{max-width:720px;width:100%;margin:18px auto 0;border-radius:12px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:16px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;flex:0 0 34px}
.fb.ok .ic{background:var(--ok)}.fb.bad .ic{background:var(--bad)}
.fb .tx{flex:1;min-width:0;overflow-wrap:anywhere}.fb .tx b{display:block;font-size:18px}
.combo{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:90px;font-size:40px;font-weight:700;font-style:italic;color:var(--gold);opacity:0;transition:opacity .2s,transform .3s;pointer-events:none;z-index:3}
.combo.show{opacity:1;transform:scale(1.15)}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.abc div{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:10px;text-align:center}
.abc .l{font-family:var(--fa);font-size:34px;line-height:1.3}.abc small{display:block;color:var(--dim);font-size:12px}
.search{width:100%;font:inherit;font-size:18px;color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.dict{display:grid;gap:4px}
.dict div{display:grid;grid-template-columns:1fr 1fr 1.3fr 70px;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--glass);font-size:15px;min-width:0}
.dict div>*{min-width:0;overflow-wrap:anywhere}.dict .fa{font-size:19px}.dict small{color:var(--dim);font-size:12px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.meter i{display:block;height:100%}
.res{text-align:center;margin-top:2vh}
.big{font-size:clamp(56px,14vw,100px);font-weight:300;line-height:1}
.big.good{color:var(--ok)}.big.mid{color:var(--gold)}.big.low{color:var(--bad)}
.stats{display:flex;gap:14px;justify-content:center;margin:18px 0 22px;flex-wrap:wrap}
.stats div{border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-width:96px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stats b{display:block;color:var(--fg);font-size:24px;font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.list{max-width:640px;margin:0 auto 22px;text-align:left;font-size:15px;display:grid;gap:6px}
.list div{display:grid;grid-template-columns:22px 1fr 1fr 1fr;gap:10px;align-items:center;padding:8px 12px;border-radius:8px;min-width:0}
.list div>*{min-width:0;overflow-wrap:anywhere}
.list .ok{background:var(--okbg)}.list .bad{background:var(--badbg)}
.list .m{font-weight:700}.list .ok .m{color:var(--ok)}.list .bad .m{color:var(--bad)}.list .fa{font-size:18px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);
background:rgba(10,20,45,.96);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:12;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.cup{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:#1a1200}
.toast small{color:var(--dim);display:block}
@media (max-width:560px){.dict div{grid-template-columns:1fr 1fr}.list div{grid-template-columns:22px 1fr 1fr}.list div span:nth-child(3){display:none}.top{gap:12px;font-size:14px}.goalbar{width:60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ================= data ================= */
if(typeof D2!=="undefined")for(const[c,o]of Object.entries(D2)){if(D[c]){const have=new Set(D[c].w.map(w=>w[0]));D[c].w.push(...o.w.filter(w=>!have.has(w[0])))}else D[c]=o}
const ZS=typeof Z!=="undefined"?Z:[];
const C=Object.keys(D),ALL="Alles door elkaar";

/* ================= memory model (FSRS-lite) ================= */
/* each word: s = stability in days (time until recall drops to 90%), t = last review, n = reviews, l = lapses */
const RET=(m,now=Date.now())=>m?Math.pow(1+19/81*((now-m.t)/864e5)/m.s,-.5):0;
function review(id,ok){const m=S.mem[id]||{s:0,t:Date.now(),n:0,l:0};const r=m.n?RET(m):0,d=Math.min(10,Math.max(1,3+BYID[id].w[3]+m.l*1.5));
 if(!m.n)m.s=ok?1.5:.3;else if(ok)m.s=Math.min(365,m.s*(1+Math.exp(.9)*(11-d)/10*Math.pow(m.s,-.15)*(Math.exp(1.1*(1-r))-.4+.5)));else{m.s=Math.max(.2,m.s*.35);m.l++}
 m.n++;m.t=Date.now();S.mem[id]=m;
 if(!ok&&!S.mist.includes(id)){S.mist.push(id);if(S.mist.length>80)S.mist.shift()}if(ok&&m.s>3)S.mist=S.mist.filter(x=>x!==id);
 const st=strong();if(st>=50)trophy("learn50");if(st>=200)trophy("learn200")}

 S.day=t;save();hud();if(S.streak>=3)trophy("streak3");if(S.streak>=7)trophy("streak7");if(S.streak>=30)trophy("streak30")}

/* ================= answer matching ================= */
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\([^)]*\)/g,"").replace(/q/g,"gh").replace(/x/g,"kh").replace(/w/g,"v").replace(/ou/g,"u").replace(/ee/g,"i").replace(/oo/g,"u").replace(/[^a-z0-9؀-ۿ]/g,"").replace(/(.)\1+/g,"$1");
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function check(input,answers){const x=nz(input);if(!x)return 0;let best=0;for(const a of answers){const y=nz(a);if(!y)continue;if(x===y)return 2;const tol=y.length>=9?2:y.length>=4?1:0;if(lev(x,y)<=tol)best=1}return best}
const nlParts=s=>[s,...s.split(/[\/;,]| of /).map(t=>t.trim()).filter(Boolean),s.replace(/\([^)]*\)/g,"").trim(),s.replace(/^(de|het|een|te) /,"")];

const qPairs=cards=>{const u=[],seen=new Set;for(const c of cards){if(!seen.has(c.w[2])&&!seen.has(c.w[0])){seen.add(c.w[2]);seen.add(c.w[0]);u.push(c)}if(u.length===5)break}return u.length>=3?{kind:"pairs",cards:u,free:1}:null};

 return{kind:"build",z,toks,pool:sh([...toks,...extra]),nl:1}}
function qCloze(z){const fa=z[0].split(" "),la=z[1].split(" ");if(fa.length!==la.length)return null;const idx=fa.map((t,i)=>i).filter(i=>fa[i].replace(/[؟?.!،]/g,"").length>1);if(!idx.length)return null;const k=idx[Math.random()*idx.length|0];
 const toks=S.latin?la:fa,ans=toks[k].replace(/[؟?.!،,]/g,"");const ds=[];for(const y of sh(ZS)){if(ds.length>=3)break;const t=(S.latin?y[1]:y[0]).split(" ");const c=t[Math.random()*t.length|0].replace(/[؟?.!،,]/g,"");if(c&&c!==ans&&!ds.includes(c))ds.push(c)}
 const opts=sh([ans,...ds]);return{kind:"cloze",z,toks,k,opts,ci:opts.indexOf(ans)}}

/* pick the right exercise for a word based on how well it's known: recognise → recall → produce */
function forWord(c,pool){const m=S.mem[c.id],n=m?m.n:0,r=Math.random();

function reveal(q){if(q.card){const w=q.card.w;return`<span class="fa">${esc(w[0])}</span> · ${esc(w[1])} · ${esc(w[2])}`}
 if(q.z)return`<span class="fa">${esc(q.z[0])}</span><br>${esc(q.z[1])}<br>${esc(q.z[2])}`;if(q.L)return`<span class="fa" style="font-size:22px">${q.L[0]}</span> · ${q.L[1]} · ${q.L[2]}`;
 if(q.rev)return q.rev;if(q.cards)return q.miss?`${q.miss} keer mis gekoppeld`:"Alles in één keer goed";return""}
function answer(ok,j,timeout,close){if(lock||!$("fbw")||!R||!R.items)return;lock=true;clearInterval(tmr);const q=R.items[R.i];q.r=ok?1:0;

 if(q.kind==="mc"||q.kind==="listen")$("tr").textContent=q.kind==="listen"?q.card.w[0]+" · "+q.card.w[1]:other(q.card.w);
 if(q.kind==="type"||q.kind==="gtype"){$("ti").classList.add(ok?"ok":"bad");$("ti").disabled=true}
 if(q.kind==="build")$("slot").classList.add(ok?"ok":"bad");
 $("card")&&($("card").className="card "+(ok?"ok":"bad"));flash(ok?"ok":"bad");
 if(q.card&&!q.re)review(q.card.id,ok);if(q.kind==="pairs")q.cards.forEach(c=>{if(!S.mem[c.id]||!q.re)review(c.id,true)});
 if(q.card&&!ok&&canSpeak())say(q.card.w[0]);
 R.res.push({q,ok});
 if(ok){R.streak++;R.best=Math.max(R.best,R.streak);R.score+=Math.round((q.h?.5:1)*R.mult*Math.min(R.streak,5));
  if(R.streak>2){const c=$("combo");c.textContent="x"+Math.min(R.streak,5);c.classList.add("show");setTimeout(()=>c.classList.remove("show"),600)}if(R.streak>=10)trophy("combo10")}
 else{R.streak=0;R.mistakes++;if(R.lives)R.left--;if(R.hearts){S.hearts=Math.max(0,S.hearts-1);if(!S.heartT)S.heartT=Date.now()}
  if(R.requeue&&!q.re){const c=Object.assign({},q,{r:undefined,re:1,h:0});if(c.kind==="build")Object.assign(c,c.nl?qBank(c.z):qBuild(c.z),{re:1});R.items.push(c)}}
 save();

function end(failed){exitRun();const done=R.res.filter(r=>r.q.kind!=="intro"),ok=done.filter(r=>r.ok).length,pct=done.length?Math.round(ok/done.length*100):0;

 const xp=failed?Math.round(R.score/2):R.score+bonus;addXP(xp);S.gems+=gem;if(done.length&&!failed)markDay();save();hud();if(done.length)trophy("first");

 <div class="stats"><div style="border-color:var(--gold)">Totaal XP<b>${xp}</b></div><div style="border-color:var(--ok)">Nauwkeurig<b>${pct}%</b></div>${gem?`<div style="border-color:var(--gem)">Diamanten<b>+${gem}</b></div>`:""}<div>Combo<b>x${R.best}</b></div>${R.extra?R.extra():""}</div>

 <div class="list">${done.filter(r=>r.q.card||r.q.z||r.q.L||r.q.row).map(r=>{const q=r.q,a=q.row?q.row:q.card?q.card.w:q.z?q.z:[q.L[0],q.L[1],q.L[2]];return`<div class="${r.ok?"ok":"bad"}"><span class="m">${r.ok?"✓":"✕"}</span><span class="fa">${esc(a[0])}</span><span>${esc(a[1])}</span><span>${esc(a[2])}</span></div>`}).join("")}</div></div>`;
 scrollTo(0,0);$("menu").onclick=()=>R.after?R.after():go(R.home||"learn");if($("again"))$("again").onclick=R.again;
 if(wrong.length)$("fix").onclick=()=>run({title:"Fouten oefenen",items:sh(wrong).map(c=>qType(c,1)),back:()=>go("practice"),home:"practice",requeue:1,onDone:()=>({gem:2})})}

/* ================= learning path ================= */
const P=u=>S.path[u]||(S.path[u]={d:0,leg:0});
function lessonItems(u,li){const U=UNITS[u],ws=U.lessons[li],pool=U.ws,items=[];
 const fresh=ws.filter(c=>!S.mem[c.id]);
 fresh.slice(0,5).forEach(c=>{items.push(qIntro(c));items.push(qMC(c,0,3,pool))});
 ws.forEach(c=>{if(!fresh.slice(0,5).includes(c)||Math.random()<.5)items.push(forWord(c,pool))});
 const prev=UNITS.slice(0,u+1).flatMap(x=>x.lessons.slice(0,x===U?li:99).flat());weakest(prev,3).forEach(c=>items.push(forWord(c,pool)));
 const pr=qPairs(sh([...ws,...prev.slice(-6)]));
 let sents=sh(sentencesFor(ws)).filter(z=>z[3]<=Math.max(1,ws[0]?.w[3]||1)+1);if(sents.length<2)sents=sents.concat(pickN(ZS,2,z=>z[3]===1));
 const ex=[];sents.slice(0,3).forEach((z,k)=>ex.push(k===0?qBank(z):k===1?qBuild(z):qCloze(z)));
 const head=items.slice(0,Math.min(items.length,4)),rest=sh(items.slice(4).concat(ex));if(pr)rest.splice(Math.min(3,rest.length),0,pr);
 return head.concat(rest).filter(Boolean).slice(0,18)}

 run({title:`Unit ${u+1} · Les ${li+1}`,items:lessonItems(u,li),hearts:1,requeue:1,path:1,back:()=>go("learn"),
  onDone:(ok,n,pct)=>{const p=P(u);let gem=5;if(p.d===li){p.d++;if(p.d===UNITS[u].lessons.length){gem+=20;trophy("unit1");if(UNITS.filter((U,i)=>P(i).d>=U.lessons.length).length>=5)trophy("units5");setTimeout(()=>toast("Unit "+(u+1)+" voltooid! +20 💎","Gefeliciteerd"),500)}}
   if(pct===100){gem+=5;trophy("perfect")}return{gem,xp:10+(pct===100?5:0)}}})}
function unitReview(u){run({title:`Unit ${u+1} · Herhaling`,items:sh(UNITS[u].ws.filter(c=>S.mem[c.id])).slice(0,12).map(c=>forWord(c,UNITS[u].ws)),hearts:0,requeue:1,path:1,back:()=>go("learn"),onDone:()=>{S.hearts=Math.min(5,S.hearts+1);return{gem:3}}})}

 run({title:`Unit ${u+1} · Legendarisch`,endTitle:"Legendarisch!",items:pickN(ws,16).map(c=>Math.random()<.6?qType(c,Math.random()<.5?0:1):qMC(c,1,6,ws)),maxMiss:2,time:15,mult:2,path:1,back:()=>go("learn"),

function practiceSession(){let due=dueList().slice(0,12);if(due.length<6)due=due.concat(weakest(CARDS,12).filter(c=>!due.includes(c))).slice(0,12);
 if(!due.length){const u=UNITS.findIndex((U,u)=>P(u).d<U.lessons.length);if(u>=0)return startLesson(u,P(u).d);return}
 run({title:"Persoonlijke oefening",items:due.map(c=>forWord(c,CARDS)).concat(qPairs(sh(due))),requeue:1,back:()=>go("practice"),home:"practice",again:practiceSession,
  onDone:()=>{S.hearts=Math.min(5,S.hearts+1);return{gem:3,xp:5}}})}

  scr.innerHTML=`<div class="qbar"><button class="btn x" id="back">✕</button><span class="sp"></span><span class="meta">Match-race · ronde <b>${round+1}</b>/4 · <b id="clock">0.0</b>s</span></div>
  <p class="sub" style="margin:14px 0">Koppel elk Perzisch woord aan de betekenis. Een fout kost 3 seconden.</p>

  $("back").onclick=()=>{exitRun();go("practice")};
  scr.querySelectorAll(".pairs .a").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;
   if(!sel||sel.dataset.s===b.dataset.s){sel&&sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
   const okm=sel.dataset.id===b.dataset.id,a=sel;sel=null;a.classList.remove("sel");
   if(okm){[a,b].forEach(x=>{x.classList.add("ok");setTimeout(()=>x.classList.add("done"),250)});if(--left===0){round++;round<4?setTimeout(draw,350):fin()}}
   else{[a,b].forEach(x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),400)});pen+=3;flash("bad")}})};
 const fin=()=>{exitRun();const tt=(Date.now()-t0)/1000+pen,k="m"+S.diff,rec=S.mtime[k],nw=!rec||tt<rec;if(nw)S.mtime[k]=tt;addXP(Math.max(5,Math.round((60-tt/3)*(S.diff+1)/2)));S.gems+=2;markDay();save();hud();trophy("match");
  scr.innerHTML=`<div class="res"><div class="big good">${tt.toFixed(1)}s</div><p class="sub">Match-race · ${DIFF[S.diff].n}</p>
  <div class="stats"><div>Fouten<b>${pen/3}</b></div><div style="border-color:var(--gold)">${nw?"Nieuw record!":"Record"}<b>${S.mtime[k].toFixed(1)}s</b></div></div>

function bindSeg(id,f){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{f(+b.dataset.v);save();hud();go(S.tab)})}

/* ================= league ================= */
function rnd(seed){let h=2166136261;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>((h=Math.imul(h^h>>>15,2246822507),h=Math.imul(h^h>>>13,3266489909),(h^=h>>>16)>>>0)/4294967296)}
function leagueRows(k,myxp,finalWeek){const r=rnd(k+"|"+S.tier),start=new Date(k.replace(/-/g,"/")).getTime(),frac=finalWeek?1:Math.min(1,Math.max(.02,(Date.now()-start)/(7*864e5)));
 const pick=BOTS.slice().sort(()=>r()-.5).slice(0,9);
 const rows=pick.map((n,i)=>{const base=(40+r()*600)*(1+S.tier*.45),act=r();return{n,xp:Math.round(base*Math.pow(frac,.8+act*.6)),col:UCOL[i%UCOL.length]}});
 rows.push({n:"Sam",xp:myxp,me:1,col:"var(--fg)"});return rows.sort((a,b)=>b.xp-a.xp||(a.me?-1:1))}
function leagueTab(){rollWeek();const rows=leagueRows(S.wk.k,S.wk.xp),T=TIERS[S.tier],fin=new Date(new Date(S.wk.k.replace(/-/g,"/")).getTime()+7*864e5),days=Math.max(0,Math.ceil((fin-Date.now())/864e5));
 scr.innerHTML=`<div style="text-align:center;margin-top:10px"><div style="font-size:52px">🏆</div><h1 style="color:${T[1]}">${T[0]}-liga</h1><p class="sub">Nog ${days} ${days===1?"dag":"dagen"} · top 3 promoveert, de laatste 2 degraderen</p>${S.lastRank?`<p class="note">Vorige week: plek ${S.lastRank}</p>`:""}</div>
 <div class="lb">${rows.map((r,i)=>`${i===3?`<p class="zone up">▲ Promotiezone</p>`:""}${i===8?`<p class="zone down">▼ Degradatiezone</p>`:""}<div class="${r.me?"me":""} ${i<3?"up":i>=8?"down":""}"><span class="r">${i+1}</span><span class="pic" style="background:${r.col}">${r.n[0]}</span><span>${r.n}${r.me?" (jij)":""}</span><b>${r.xp} XP</b></div>`).join("")}</div>
 <p class="note" style="text-align:center;margin-top:14px">De tegenstanders zijn gesimuleerd. Verdien XP met lessen en spellen om te stijgen.</p>`}

function profileTab(){const units=UNITS.filter((U,u)=>P(u).d>=U.lessons.length).length,legs=Object.values(S.path).filter(p=>p.leg).length;

  <div><span class="ic">❤️</span><span class="tx"><b>Hartjes bijvullen</b><small>Meteen weer 5 hartjes.</small></span><button class="btn" id="bh" ${S.gems<150||S.hearts>=5?"disabled":""}>150 💎</button></div></div>

 bindSeg("sg",v=>S.goal=[10,30,50,100][v]);bindSeg("sl",v=>S.latin=!!v);bindSeg("st",v=>S.tts=v);

 if(!q||!$("fbw"))return;if(!lock&&/^[1-6]$/.test(k)&&q.opts&&+k<=q.opts.length)answer(+k-1===q.ci,+k-1);else if(k==="Enter"&&lock&&$("nx")){e.preventDefault();next()}});

const cv=$("w"),x=cv.getContext("2d"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let T=0;
function wave(){const W=cv.width=innerWidth,H=cv.height=innerHeight;x.clearRect(0,0,W,H);
 for(let l=0;l<3;l++){x.beginPath();for(let px=0;px<=W;px+=8){const y=H*.78+Math.sin(px/(220+l*60)+T*(.6+l*.2)+l)*28+Math.sin(px/90+T)*8+l*24;px?x.lineTo(px,y):x.moveTo(px,y)}
  x.strokeStyle=`rgba(160,200,255,${.14-l*.04})`;x.lineWidth=1.5;x.stroke()}T+=.01;if(!rm)requestAnimationFrame(wave)}
wave();rollWeek();go(S.tab||"learn");
